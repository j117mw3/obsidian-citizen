name: Release

# Pushing a version tag (for example 0.1.2) builds the plugin from the tagged source, records a signed
# provenance attestation for the three release files, and publishes them as a GitHub release.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write      # create the release
  id-token: write      # sign the attestation
  attestations: write  # store the attestation

jobs:
  release:
    # Historical 0.1–0.4 tags and the manually staged first 0.5.0 release must
    # never auto-publish when the archive backfill creates their tags.
    if: ${{ !startsWith(github.ref_name, '0.1.') && !startsWith(github.ref_name, '0.2.') && !startsWith(github.ref_name, '0.3.') && !startsWith(github.ref_name, '0.4.') && github.ref_name != '0.5.0' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check that the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $version" >&2
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --title "$GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
